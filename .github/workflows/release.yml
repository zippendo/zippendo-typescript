name: Release

# Zippendo's release pipeline generates this SDK and pushes a version tag; this workflow publishes it.
# Publishing from this public repository with npm trusted publishing is what attaches provenance that
# links the package to this commit and run. The trusted publisher on npmjs.com names this file, so
# renaming it stops releases until that setting is updated.

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check the tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"

      # Trusted publishing needs npm 11.5.1 or later; `prepare` compiles with the devDependencies.
      - name: Build
        run: |
          npm install -g npm@^11.5.1
          npm install

      # Skipping a version npm already has makes a failed run safe to re-run.
      - name: Publish to npm
        run: |
          name=$(node -p 'require("./package.json").name')
          if npm view "$name@${GITHUB_REF_NAME#v}" version > /dev/null 2>&1; then
            echo "$name@${GITHUB_REF_NAME#v} is already on npm."
          else
            npm publish --access public
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1 && exit 0
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes \
            "Install with \`npm install @zippendo/sdk@${GITHUB_REF_NAME#v}\`. Guide: https://www.zippendo.com/docs/sdks/overview"
